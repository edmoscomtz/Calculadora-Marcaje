<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcaje de Carpas</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 20px; 
            max-width: 500px; 
            margin: 0 auto; 
            background-color: #f4f4f9; 
            color: #333;
        }
        h2 { text-align: center; color: #1a1a1a; }
        h3 { margin-top: 30px; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 14px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-top: 5px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
            background: #fff;
        }
        .hipo-box {
            background: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }
        .hipo-box span:last-child { color: #0056b3; }
        
        .result-box { 
            background: #fff; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            margin-top: 25px; 
            border-left: 5px solid #0056b3;
        }
        .result-item { margin-bottom: 12px; font-size: 18px; display: flex; justify-content: space-between; }
        .result-item span { font-weight: bold; color: #0056b3; }
        
        .diagram-container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            margin-top: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }
        svg { width: 100%; max-width: 300px; height: auto; overflow: visible; }
        .punto-label { font-weight: bold; font-size: 16px; fill: #d9534f; }
    </style>
</head>
<body>

    <h2>Calculadora de Marcaje</h2>

    <h3 style="margin-top: 10px;">Dimensiones de Carpa</h3>
    
    <label for="dim1">Dimensión 1 (Base):</label>
    <input type="number" id="dim1" placeholder="Ej. 10" oninput="calcular()">

    <label for="dim2">Dimensión 2 (Altura):</label>
    <input type="number" id="dim2" placeholder="Ej. 5" oninput="calcular()">

    <div class="hipo-box">
        <span>Hipotenusa de la carpa:</span> 
        <span id="res-hipo">0.00</span>
    </div>

    <div class="result-box">
        <h3 style="margin-top: 0;">Puntos de marcaje con 1 Cinta</h3>
        
        <!-- El campo de la cinta ahora está dentro de la caja de resultados -->
        <label for="cinta" style="margin-top: 15px;">La cinta comienza en:</label>
        <input type="number" id="cinta" placeholder="0" oninput="calcular()" style="margin-bottom: 20px;">

        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
        
        <div class="result-item">Punto 1: <span id="res-p1">0.00</span></div>
        <div class="result-item">Punto 2: <span id="res-p2">0.00</span></div>
        <div class="result-item">Punto 3: <span id="res-p3">0.00</span></div>
    </div>

    <div class="diagram-container">
        <h3 style="margin-top: 0;">Diagrama</h3>
        <svg viewBox="-10 -10 220 170">
            <!-- Triángulo rectángulo -->
            <polygon points="20,130 180,130 20,20" fill="#e9ecef" stroke="#0056b3" stroke-width="3"/>
            
            <!-- Etiquetas de dimensiones -->
            <text x="100" y="145" font-size="12" text-anchor="middle" fill="#333">Dimensión 1 (Base)</text>
            <text x="10" y="75" font-size="12" text-anchor="middle" transform="rotate(-90 10,75)" fill="#333">Dimensión 2 (Altura)</text>
            
            <!-- Hipotenusa -->
            <text x="105" y="65" font-size="12" text-anchor="middle" transform="rotate(34 105,65)" fill="#0056b3" font-weight="bold">Hipotenusa</text>
            
            <!-- Nodos/Puntos -->
            <circle cx="20" cy="130" r="5" fill="#d9534f"/> <!-- P1 -->
            <circle cx="20" cy="20" r="5" fill="#d9534f"/> <!-- P2 -->
            <circle cx="180" cy="130" r="5" fill="#d9534f"/> <!-- P3 -->
            
            <!-- Etiquetas de Puntos -->
            <text x="0" y="150" class="punto-label">P1</text>
            <text x="25" y="10" class="punto-label">P2</text>
            <text x="190" y="140" class="punto-label">P3</text>
        </svg>
    </div>

    <script>
        function calcular() {
            // Obtener valores
            let cinta = parseFloat(document.getElementById('cinta').value) || 0;
            let dim1 = parseFloat(document.getElementById('dim1').value) || 0;
            let dim2 = parseFloat(document.getElementById('dim2').value) || 0;

            // Calcular hipotenusa
            let hipotenusa = Math.sqrt(Math.pow(dim1, 2) + Math.pow(dim2, 2));

            // Calcular puntos
            let p1 = cinta;
            let p2 = cinta + dim1;
            let p3 = p2 + hipotenusa;

            // Mostrar resultados
            document.getElementById('res-hipo').innerText = hipotenusa.toFixed(2);
            document.getElementById('res-p1').innerText = p1.toFixed(2);
            document.getElementById('res-p2').innerText = p2.toFixed(2);
            document.getElementById('res-p3').innerText = p3.toFixed(2);
        }
    </script>

</body>
</html>
